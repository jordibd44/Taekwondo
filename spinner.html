<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Elige al azar un pumse de Taekwondo para practicar.">
  <title>Ruleta de Pumses · Examen de Taekwondo</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    .spinner-main {
      display: grid;
      place-items: center;
      align-content: start;
      padding-top: 30px;
    }

    .spinner-card {
      width: min(100%, 620px);
      padding: clamp(18px, 5vw, 32px);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }

    .spinner-card h2 {
      margin: 0 0 8px;
      color: var(--text);
    }

    .spinner-intro,
    .remaining {
      color: var(--muted);
    }

    .wheel-wrap {
      position: relative;
      width: min(100%, 440px);
      aspect-ratio: 1;
      margin: 26px auto 18px;
      padding: 10px;
      border: 4px solid #2563eb;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2);
    }

    #wheel {
      display: block;
      width: 100%;
      height: 100%;
    }

    .pointer {
      position: absolute;
      z-index: 1;
      top: -5px;
      left: 50%;
      width: 0;
      height: 0;
      transform: translateX(-50%);
      border-right: 17px solid transparent;
      border-left: 17px solid transparent;
      border-top: 0;
      border-bottom: 30px solid #0f172a;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25));
    }

    #spinButton {
      min-width: 180px;
      background: var(--primary);
    }

    #result {
      min-height: 2.2em;
      margin: 18px 0 6px;
      color: var(--text);
      font-size: clamp(1.2rem, 4vw, 1.65rem);
      font-weight: 750;
    }

    .spinner-actions {
      margin-top: 16px;
    }

    @media (max-width: 420px) {
      .wheel-wrap {
        padding: 7px;
        border-width: 3px;
      }
    }
  </style>
</head>
<body>
  <a class="skip" href="#main">Saltar al contenido</a>
  <header class="hero">
    <h1>🎯 Ruleta de Pumses</h1>
    <p class="subtitulo">Gira la ruleta para elegir qué pumse practicar.</p>
  </header>

  <main id="main" class="spinner-main">
    <section class="spinner-card" aria-labelledby="spinnerTitle">
      <h2 id="spinnerTitle">¿Cuál vas a practicar?</h2>
      <p class="spinner-intro">Cada pumse saldrá una vez por ronda.</p>
      <p id="remaining" class="remaining"></p>

      <div class="wheel-wrap">
        <span class="pointer" aria-hidden="true"></span>
        <canvas id="wheel" role="img" aria-label="Ruleta con los pumses disponibles">
          Ruleta de pumses. Usa el botón Girar para elegir uno.
        </canvas>
      </div>

      <button type="button" id="spinButton">Girar</button>
      <p id="result" role="status" aria-live="polite" aria-atomic="true"></p>
      <div class="acciones spinner-actions">
        <button type="button" id="restartButton" class="secundario" hidden>Empezar otra ronda</button>
        <a class="boton secundario" href="./index.html">Volver al menú</a>
      </div>
    </section>
  </main>

  <footer>
    <a href="https://github.com/jordibd44/Taekwondo" target="_blank" rel="noopener">
      <img src="https://cdn.jsdelivr.net/npm/simple-icons@v9/icons/github.svg" alt="" width="20" height="20">
      Ver en GitHub
    </a>
  </footer>

  <script>
    const pumses = [
      "Taeguk Il Jang",
      "Taeguk Yi Jang",
      "Taeguk Sam Jang",
      "Taeguk Sa Jang",
      "Taeguk Oh Jang",
      "Taeguk Yuk Jang",
      "Taeguk Chil Jang",
      "Taeguk Pal Jang",
      "Koryo",
      "Keumgang",
      "Taebaek"
    ];
    const colors = [
      "#bfdbfe", "#bbf7d0", "#fef08a", "#c7d2fe",
      "#fed7aa", "#e9d5ff", "#a5f3fc", "#fbcfe8",
      "#d9f99d", "#fecaca", "#bae6fd"
    ];
    const canvas = document.getElementById("wheel");
    const ctx = canvas.getContext("2d");
    const spinButton = document.getElementById("spinButton");
    const restartButton = document.getElementById("restartButton");
    const result = document.getElementById("result");
    const remaining = document.getElementById("remaining");
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
    let available = [...pumses];
    let angle = 0;
    let spinning = false;

    function drawWheel() {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !available.length) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const size = rect.width;
      const center = size / 2;
      const radius = center - 3;
      const step = (Math.PI * 2) / available.length;
      ctx.clearRect(0, 0, size, size);

      available.forEach((name, index) => {
        const start = angle + index * step;
        const end = start + step;

        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(start + step / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#0f172a";
        ctx.font = `700 ${Math.max(10, Math.min(14, size * 0.032))}px system-ui, sans-serif`;
        ctx.fillText(name, radius - 12, 0, radius * 0.68);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(center, center, Math.max(5, size * 0.025), 0, Math.PI * 2);
      ctx.fillStyle = "#0f172a";
      ctx.fill();
    }

    function updateRemaining() {
      remaining.textContent = `${available.length} ${available.length === 1 ? "pumse disponible" : "pumses disponibles"}`;
      canvas.setAttribute("aria-label", `Ruleta con ${available.length} ${available.length === 1 ? "pumse disponible" : "pumses disponibles"}`);
    }

    function finishSpin(finalAngle) {
      angle = ((finalAngle % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
      const step = (Math.PI * 2) / available.length;
      const pointerAngle = (Math.PI * 1.5 - angle + Math.PI * 2) % (Math.PI * 2);
      const winnerIndex = Math.floor(pointerAngle / step) % available.length;
      const winner = available.splice(winnerIndex, 1)[0];

      drawWheel();
      result.textContent = `Te toca practicar: ${winner}`;
      updateRemaining();
      spinning = false;
      spinButton.disabled = false;

      if (!available.length) {
        spinButton.disabled = true;
        restartButton.hidden = false;
        result.textContent += ". Has completado la ronda.";
      }
    }

    function spin() {
      if (spinning || !available.length) return;

      spinning = true;
      spinButton.disabled = true;
      restartButton.hidden = true;
      result.textContent = "";

      const startAngle = angle;
      const extraTurns = 4 + Math.random() * 3;
      const targetAngle = startAngle + extraTurns * Math.PI * 2 + Math.random() * Math.PI * 2;

      if (reducedMotion.matches) {
        finishSpin(targetAngle);
        return;
      }

      const startTime = performance.now();
      const duration = 4200;
      function animate(now) {
        const progress = Math.min((now - startTime) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 4);
        angle = startAngle + (targetAngle - startAngle) * eased;
        drawWheel();

        if (progress < 1) {
          requestAnimationFrame(animate);
        } else {
          finishSpin(targetAngle);
        }
      }
      requestAnimationFrame(animate);
    }

    function restart() {
      available = [...pumses];
      angle = 0;
      result.textContent = "";
      restartButton.hidden = true;
      spinButton.disabled = false;
      updateRemaining();
      drawWheel();
      spinButton.focus();
    }

    spinButton.addEventListener("click", spin);
    restartButton.addEventListener("click", restart);
    window.addEventListener("resize", drawWheel);
    updateRemaining();
    drawWheel();
  </script>
</body>
</html>
